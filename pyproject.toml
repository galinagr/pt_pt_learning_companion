[project]
name = "pt-pt-learning-companion"
version = "0.1.0"
description = "Local European Portuguese companion: translate, explore, and talk through a FastAPI app."
requires-python = ">=3.12"
authors = [
    { name = "Halyna Hriaznova", email = "ggadar@gmail.com" },
]
dependencies = [
    "edge-tts>=7.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.11",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
